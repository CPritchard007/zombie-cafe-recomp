<!doctype html><title>Walking direction check</title><style>body{background:#e5e0cf;font:18px sans-serif}canvas{border:1px solid #444}</style><h1>Walking direction check</h1><p>Native clips, unmirrored (top); current four-direction movement (bottom).</p><canvas width="1000" height="650"></canvas><script type="module">
import {loadCharacters,drawCharacter,facingForMovement} from './characters.js';
const load=src=>new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i);i.src=src;});const assets=await loadCharacters(load);const form=assets.catalog.forms.find(f=>f.name==='businessman-human');const c=document.querySelector('canvas').getContext('2d');
function frame(t){c.clearRect(0,0,1000,650);c.fillStyle='#222';c.font='20px sans-serif';for(const [i,clip] of ['walkSW','walkNW'].entries()){c.fillText(clip+' unmirrored',130+i*480,35);drawCharacter(c,assets,form,clip,t/1000,240+i*480,230,.35);}
for(const [i,[dx,dy,label]] of [[1,0,'SE'],[0,1,'SW'],[-1,0,'NW'],[0,-1,'NE']].entries()){const f=facingForMovement(dx,dy);const sx=dx-dy,sy=dx+dy,x=125+i*245,y=470;const k=(t/1000%2-1)*40;c.fillText(label,x-20,330);c.beginPath();c.moveTo(x-sx*60,y-sy*35);c.lineTo(x+sx*60,y+sy*35);c.lineTo(x+sx*45,y+sy*35);c.stroke();drawCharacter(c,assets,form,'walk'+(f.north?'NW':'SW'),t/1000,x+sx*k,y+sy*k*.6,.28,f.flip);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
